script: |
  cd ~/my_app
  git pull origin main
  docker build -t my_app .
  docker stop my_app || true
  docker rm my_app || true
  docker stop my-app || true
  docker rm my-app || true
  docker run -d -p 8080:8080 \
    --name my_app \
    --restart always \
    -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
    my_app
