name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:

  # Stage 1: Unit Tests
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: pytest tests/unit/ -v

  # Stage 2: Static Analysis + Security
  static-analysis:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check formatting
        run: black --check .
      - name: Check code style
        run: flake8 . --max-line-length=88 --exclude=venv,tests
      - name: Security scan code
        run: bandit -r . --exclude ./venv,./tests
      - name: Security scan dependencies
        run: pip-audit -r requirements.txt

  # Stage 3: Deploy (only if all stages pass)
  deploy:
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/my_app
            git pull origin main
            docker build -t my_app .
            docker stop my_app || true
            docker rm my_app || true
            docker run -d -p 8080:8080 --name my_app --restart always my_app
